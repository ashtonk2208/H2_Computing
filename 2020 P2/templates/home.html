<!DOCTYPE html>
<html>
<head><title>Website</title></head>
<body>
	<table border = '1'>
		<tr>
			<th>Full Name</th>
			<th>Screen Name</th>
			<th>Identity</th>
		</tr>
		{%for i in cursor%}
				<tr>
					<th>{{i[0]}}</th>
					<th>{{i[1]}}</th>
					{%if i[2] == 0%}
						<th>Student</th>
					{%else%}
						<th>Staff</th>
					{%endif%}
				</tr>
		{%endfor%}
	</table>
</body>
</html>
